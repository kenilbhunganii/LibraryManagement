{% extends "base.html" %}

{% block title %}Add Member{% endblock %}
{% block topbar_title %}Register Member{% endblock %}

{% block content %}
<div class="page-header fade-up">
  <div class="page-header-left">
    <p class="page-eyebrow">Members → New</p>
    <h1 class="page-title">Add Member</h1>
  </div>
</div>

<div class="form-card fade-up fade-up-1">
  <div class="form-card-header">
    <p class="form-card-title">Member Details</p>
    <p class="form-card-sub">Register a new library member</p>
  </div>

  <div class="form-body">
    <form method="POST" action="{{ url_for('add_user') }}">

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="name">Full Name</label>
          <input type="text" id="name" name="name" class="form-input"
            placeholder="Jane Doe" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="user_id">Member ID</label>
          <div style="position: relative;">
            <input type="text" id="user_id" name="user_id" class="form-input"
              placeholder="MEM-001" required style="padding-right: 90px;">
            <button type="button" id="regen-btn" onclick="generateId()"
              title="Generate new ID"
              style="
                position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
                background: var(--gray-100, #f3f4f6);
                border: 1px solid var(--gray-200, #e5e7eb);
                border-radius: 6px;
                padding: 3px 10px;
                font-size: 11px;
                font-weight: 600;
                color: var(--gray-600, #4b5563);
                cursor: pointer;
                letter-spacing: 0.02em;
                line-height: 1.6;
                transition: background 0.15s;
              "
              onmouseover="this.style.background='var(--gray-200,#e5e7eb)'"
              onmouseout="this.style.background='var(--gray-100,#f3f4f6)'"
            >↺ New</button>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">
          Email <span style="color:var(--gray-400); font-weight:400; text-transform:none; letter-spacing:0;">(optional)</span>
        </label>
        <input type="email" id="email" name="email" class="form-input"
          placeholder="jane@example.com">
      </div>

      <div class="form-group" style="margin-bottom: 0;">
        <label class="form-label" for="phone">
          Phone <span style="color:var(--gray-400); font-weight:400; text-transform:none; letter-spacing:0;">(optional)</span>
        </label>
        <input type="text" id="phone" name="phone" class="form-input"
          placeholder="+1 234 567 8900">
      </div>

      <div class="form-footer">
        <a href="{{ url_for('users') }}" class="btn btn-outline">← Cancel</a>
        <button type="submit" class="btn btn-primary">Register Member</button>
      </div>

    </form>
  </div>
</div>

<script>
  // Existing member IDs passed from Flask so we never generate a duplicate
  const existingIds = new Set({{ existing_ids | tojson }});

  function generateId() {
    let id;
    let attempts = 0;
    do {
      const num = String(Math.floor(Math.random() * 9000) + 1000); // 1000–9999
      id = "MEM-" + num;
      attempts++;
    } while (existingIds.has(id) && attempts < 100);

    document.getElementById("user_id").value = id;
  }

  // Auto-fill on page load
  generateId();
</script>
{% endblock %}
