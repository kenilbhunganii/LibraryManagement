{% extends "base.html" %}

{% block title %}Add Book{% endblock %}
{% block topbar_title %}Add New Book{% endblock %}

{% block content %}
<div class="page-header fade-up">
  <div class="page-header-left">
    <p class="page-eyebrow">Catalog → New Entry</p>
    <h1 class="page-title">Add Book</h1>
  </div>
</div>

<div class="form-card fade-up fade-up-1">
  <div class="form-card-header">
    <p class="form-card-title">Book Details</p>
    <p class="form-card-sub">Fill in all fields to add a new book</p>
  </div>

  <div class="form-body">
    <form method="POST" action="{{ url_for('add_book') }}">

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="title">Title</label>
          <input type="text" id="title" name="title" class="form-input"
            placeholder="The Great Gatsby" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="author">Author</label>
          <input type="text" id="author" name="author" class="form-input"
            placeholder="F. Scott Fitzgerald" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="year">Year Published</label>
          <input type="number" id="year" name="year" class="form-input"
            placeholder="1925" min="1000" max="2099" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="isbn">ISBN</label>
          <input type="text" id="isbn" name="isbn" class="form-input"
            placeholder="978-0-7432-7356-5" required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="genre">Genre</label>
        <div class="form-select-wrap">
          <select id="genre" name="genre" class="form-select">
            <option value="">— Select genre —</option>
            <option>Fiction</option>
            <option>Non-Fiction</option>
            <option>Science Fiction</option>
            <option>Fantasy</option>
            <option>Mystery</option>
            <option>Biography</option>
            <option>History</option>
            <option>Science</option>
            <option>Self-Help</option>
            <option>Poetry</option>
            <option>Other</option>
          </select>
        </div>
      </div>

      <div class="form-group" style="margin-bottom: 0;">
        <label class="form-label" for="description">Description <span style="color:var(--gray-400)">(optional)</span></label>
        <textarea id="description" name="description" class="form-input"
          style="resize: vertical; min-height: 90px;"
          placeholder="A short summary of the book…"></textarea>
      </div>

      <div class="form-footer">
        <a href="{{ url_for('books') }}" class="btn btn-outline">← Cancel</a>
        <button type="submit" class="btn btn-primary">Save Book</button>
      </div>

    </form>
  </div>
</div>
{% endblock %}
